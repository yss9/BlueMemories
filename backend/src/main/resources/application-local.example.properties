server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/blueMemories?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=your-local-mysql-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=replace-with-at-least-sixty-four-bytes-random-secret-value-for-local
jwt.expiration-millis=36000000

gpt_api.key=your-openai-api-key
youtube_api.key=your-youtube-api-key
sentiment_api.key=your-sentiment-api-key
sentiment_api.key_id=your-sentiment-api-key-id

cloud.aws.credentials.access-key=your-aws-access-key
cloud.aws.credentials.secret-key=your-aws-secret-key
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=your-local-or-dev-bucket

ai.provider=ollama
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:14b
openai.base-url=https://api.openai.com/v1
openai.model=gpt-4o-mini

cors.allowed-origins=http://localhost:3000
